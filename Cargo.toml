[package]
name = "nm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nm"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18"
figment = { version = "0.10.19", features = ["env", "toml"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "uuid", "json", "ipnet"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "zeroize"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.1", features = ["v7", "serde"] }

# Keeps argon2 fast in debug and test builds.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
axum-test = "21.1.0"
