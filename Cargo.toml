[package]
name = "nm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nm"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }

# Keeps argon2 fast in debug and test builds.
[profile.dev.package."*"]
opt-level = 2
