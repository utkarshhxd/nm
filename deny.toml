[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (Marvin attack): a timing side channel in RSA PRIVATE-key operations (PKCS#1 v1.5
# decryption and signing). No patched `rsa` exists upstream. Ignored because:
#  - `rsa` reaches us through `webauthn-rs` and, in tests only, through the dev-dependency
#    `webauthn-authenticator-rs`; both reach it via `crypto-glue`. Every use is RS256/RS384
#    signature VERIFICATION — a public-key operation — at webauthn-rs-core `crypto.rs:562`
#    (the `COSEKeyPublic::RsaS256` arm) and crypto-glue `x509/chain.rs:376` and `:388`.
#    (The line numbers here were each several lines short of the call they name; they are the
#    `verifier.verify(...)` lines in `crypto-glue 0.2.2` and `webauthn-rs-core 0.6.2`.)
#  - NM performs no RSA private-key operation THROUGH `rsa`, which is the crate the advisory is
#    against. The advisory is not about RSA in general; it is a timing side channel in that
#    implementation.
#
#    THIS CLAUSE USED TO SAY "NM holds no RSA private key and performs no RSA private-key
#    operation", and as of M2a that is FALSE. The product now holds a DKIM private key per
#    app-signed sending domain, encrypted at rest, and signs every outgoing message with it
#    (`src/mail/dkim.rs`). The ignore is still correct and the conclusion never moved, but the
#    stated reason had stopped being true — in the one file written to be trusted literally. It was
#    caught by a reviewer, not by the gate, which is the argument for why this paragraph is long.
#
#    DKIM signs over `ring`'s `RsaKeyPair`, specifically to keep the `rsa` crate free of
#    private-key callers. `ring`'s RSA signing is constant-time and is not what RUSTSEC-2023-0071
#    is about. `cargo tree -d -i ring` prints nothing: one version, already in the tree via rustls.
# RE-VERIFY ON EVERY `webauthn-rs` OR `crypto-glue` BUMP: crypto-glue already ships private-key
# operations (`new_key`, `oaep_sha256_decrypt`) that a future version could start using, and this
# ignore would silently cover that. If either is reached by a new caller, drop the ignore.
# AND RE-VERIFY ON ANY NEW DKIM OR CRYPTO WORK: the test is no longer "does NM sign with RSA" —
# it does — but "does any RSA private-key operation reach the `rsa` crate". Check with
# `cargo tree -i rsa` and read the callers, not the crate list.
# RUSTSEC-2026-0543 (`chrono`) and RUSTSEC-2026-0555 (`chrono-tz`), both `unmaintained`: no
# vulnerability, no exploit, and no patched version can exist, because the finding IS the
# maintenance status. They arrived from an advisory-database refresh, not from anything this
# repository changed — `cargo deny` was green on these same versions earlier in this branch.
#
# Dropping our direct use would not remove either crate: `sqlx` is built with its `chrono` feature
# and `utoipa` with its own, so `chrono` arrives transitively whatever we do. Removing it means
# moving both to the `time` crate and rewriting every timestamp in the tree — a project-wide
# migration, deliberately not smuggled into an unrelated milestone.
#
# RE-VERIFY WHEN EITHER IS TRUE, AND DROP THE IGNORE RATHER THAN EXTEND IT:
#  - either advisory is reclassified from `unmaintained` to a vulnerability or an unsoundness, or
#  - `sqlx` and `utoipa` both offer a `time` backend we can take, at which point the migration is
#    a day's work and this ignore stops being the cheaper answer.
#
# An `unmaintained` crate is not harmless over time: the risk is that the next CVE in it never gets
# a fix. This ignore buys schedule, not safety, and it is reviewed on the triggers above.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0543", "RUSTSEC-2026-0555"]

[licenses]
version = 2
private = { ignore = true } # exempts our own unpublished crate
unused-allowed-license = "allow"
allow = [
  "MIT",
  # 0BSD arrives with `quoted_printable`, through `lettre`, which M2a needs for SMTP and MIME.
  # It is the BSD Zero Clause License: OSI approved, FSF approved, and strictly MORE permissive
  # than MIT, which is already on this list — it drops even the attribution and notice
  # requirements, so anything MIT allows this allows. Added deliberately rather than by widening
  # the list to "anything permissive": the next unfamiliar licence should fail this gate too and
  # get its own line and its own sentence.
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"

# `lettre`'s `tracing` feature logs every line written to the relay at DEBUG, and one of those
# lines is `AUTH PLAIN <base64>`. That is the relay's password, trivially decodable, in a log file
# — spec §8 invariant 7 defeated by a feature nobody chose. Feature unification can turn it on
# from any future dependency with nobody touching our `lettre` line, so this is a gate failure
# rather than a comment asking people not to. If it ever has to be enabled, the password has to
# stop reaching lettre as a credential first.
[[bans.features]]
crate = "lettre"
deny = ["tracing"]

# `mrml`'s loader features make the MJML *parser* fetch URLs. `mj-include` names a path or an
# address, and with any of these enabled that name is resolved at parse time — so an operator
# composing an email, or anyone who can get MJML in front of this server, chooses what the server
# requests. That is request forgery reaching whatever the server can reach, including a cloud
# metadata endpoint and anything else inside the network, and it is driven by content the product
# exists to let people write.
#
# All six are denied, not just `http-loader`: `http-loader-base` is the machinery, the two
# `-reqwest` variants and `-ureq` are the clients that do the fetching, and `local-loader` reads
# the filesystem, which is the same problem aimed at files instead of hosts. The alias re-exports
# one of the others, so denying only the alias would leave the capability reachable.
#
# Rendering is NOT the risk and is not banned: `css-inline` builds its inliner with
# `load_remote_stylesheets(false)` (mrml-6.0.1 `src/mjml/render.rs:85`), so a rendered document
# fetches nothing. The hazard is strictly at parse time.
#
# If an include loader is ever genuinely wanted, it needs an allowlist and a resolver that cannot
# reach private addresses — not this flag.
[[bans.features]]
crate = "mrml"
deny = [
  "http-loader",
  "http-loader-base",
  "http-loader-async-reqwest",
  "http-loader-blocking-reqwest",
  "http-loader-ureq",
  "local-loader",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
