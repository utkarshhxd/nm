[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The workspace crate itself is AGPL-3.0-only (unpublished), the rest must be on this list.
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "GPL-3.0",
  "AGPL-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
