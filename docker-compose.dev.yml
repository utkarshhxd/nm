services:
  postgres:
    image: postgres:16-alpine
    # 100 is the default and it is not enough for this suite: `sqlx::test` gives every test its own
    # database, and `tests/lock_order.rs` now opens a pool of its own per test on top of that.
    #
    # THIS IS NOT WHAT CAUSED THE lock_order FLAKE, though an earlier version of this comment said
    # it was. That failure was a client-side budget, not a server-side ceiling: `#[sqlx::test]`
    # pools are children of one process-wide master pool capped at 20, each child steals permits
    # from it, and pool creation opens a connection eagerly — so on a 16-core box the sixteen tests
    # libtest has in flight had spent sixteen of the twenty before any test reached its critical
    # section. A route that then cannot acquire does not block, it waits out sqlx's 30 s
    # `acquire_timeout` and answers 500, and `settle` truthfully reports that no interleaving
    # formed. The two 30 s waits are the ~40 s signature a failing run had.
    #
    # The raise is kept because it is correct on its own terms — those per-test pools need room —
    # and recorded wrongly once already, so: check the client's pool arithmetic before this number.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: nm
      POSTGRES_PASSWORD: nm
      POSTGRES_DB: nm
    ports:
      - "5432:5432"
    volumes:
      - nm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nm -d nm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Linux build environment (Windows can't link Rust here). Run via scripts/dev.sh.
  dev:
    profiles: ["tools"]
    build:
      context: docker
      dockerfile: dev.Dockerfile
    working_dir: /work
    # `.env` is how NM_SECRET_KEY reaches the container: compose's own `--env-file` only feeds
    # variable substitution in this file, never the process environment inside the service.
    # Optional, so a clone that has not run `cp .env.example .env` yet still builds and tests.
    env_file:
      - path: .env
        required: false
    # Set after `env_file`, so these win: inside the container Postgres is the service `postgres`,
    # never `localhost`.
    environment:
      DATABASE_URL: postgres://nm:nm@postgres:5432/nm
      NM_DATABASE_URL: postgres://nm:nm@postgres:5432/nm
    ports:
      - "8080:8080"
    volumes:
      - .:/work
      - nm_target:/work/target
      - nm_cargo_registry:/usr/local/cargo/registry
      - nm_cargo_git:/usr/local/cargo/git
      # Linux-native install, kept off the Windows bind mount: esbuild and rollup ship
      # platform-specific binaries, and the host filesystem is slow for a tree this size.
      - nm_web_node_modules:/work/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nm_pgdata:
  nm_target:
  nm_cargo_registry:
  nm_cargo_git:
  nm_web_node_modules:
