services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nm
      POSTGRES_PASSWORD: nm
      POSTGRES_DB: nm
    ports:
      - "5432:5432"
    volumes:
      - nm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nm -d nm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nm_pgdata:
