name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nm
          POSTGRES_PASSWORD: nm
          POSTGRES_DB: nm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nm -d nm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nm:nm@localhost:5432/nm
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - run: sqlx migrate run
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo sqlx prepare --check -- --all-targets
      # The committed spec is what web/src/api/schema.d.ts was generated from.
      #
      # This prints the drift rather than piping into `diff`, because a bare pipe says only that
      # the two differ and GitHub expires a job's logs long before anyone asks why. This gate
      # failed on a runner while passing locally, byte for byte, and there was no way left to see
      # what it had found. The summary is for whoever opens the run; the artifact is for whoever
      # has to diff it against their own machine.
      - name: Committed OpenAPI spec is current
        run: |
          # The generator dies on the runner intermittently, writing nothing. Run 44042256634
          # failed here with a zero-byte stdout; the identical code passed on the very next run.
          # The cause is still unknown, so the two halves of this gate are kept apart.
          #
          # Keeping them apart matters because a pipeline's status is only the LAST command's:
          # the earlier `cargo run … | diff -` form reported every one of those deaths as drift,
          # and four runs on main were read as a spec difference that did not exist. Check the
          # generator's own status first and keep its stderr — when this returns, that file is
          # the only place the reason will appear.
          if ! cargo run -q -- openapi \
               > "$RUNNER_TEMP/openapi.generated.json" 2> "$RUNNER_TEMP/openapi.stderr"; then
            status=$?
            {
              echo '## The OpenAPI generator failed; this is not drift'
              echo
              echo "\`cargo run -q -- openapi\` exited $status after writing"
              echo "$(wc -c < "$RUNNER_TEMP/openapi.generated.json") bytes to stdout."
              echo
              echo '```'
              tail -c 20000 "$RUNNER_TEMP/openapi.stderr"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the openapi subcommand failed; see the job summary"
            exit "$status"
          fi
          if ! diff -u web/src/api/openapi.json "$RUNNER_TEMP/openapi.generated.json" \
               > "$RUNNER_TEMP/openapi.diff"; then
            {
              echo '## The committed OpenAPI spec is not what the server generates'
              echo
              echo "committed:  $(wc -c < web/src/api/openapi.json) bytes"
              echo "generated:  $(wc -c < "$RUNNER_TEMP/openapi.generated.json") bytes"
              echo
              echo '```diff'
              head -c 60000 "$RUNNER_TEMP/openapi.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OpenAPI drift; see the job summary and the openapi-drift artifact"
            exit 1
          fi
      - name: Keep the generated spec when it drifted
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-drift
          path: ${{ runner.temp }}/openapi.*
          if-no-files-found: ignore
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The other half of `gen:api`. The `rust` job checks openapi.json against the server;
      # without this, schema.d.ts could be generated from an older spec and nothing would notice.
      - name: Generated schema.d.ts is current
        run: pnpm gen:schema && git diff --exit-code src/api/schema.d.ts
      - run: pnpm typecheck
      # `pnpm test` includes the component tests, which run in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm check:licenses

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nm
          POSTGRES_PASSWORD: nm
          POSTGRES_DB: nm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nm -d nm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # web/e2e/support/server.ts creates and drops `nm_e2e_<random>` on this server. The `nm`
      # database named here is only how it reaches the server; it is never written to.
      DATABASE_URL: postgres://nm:nm@localhost:5432/nm
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Keep the version equal to `sqlx` in Cargo.toml, as the `rust` job does. The harness
      # shells out to `sqlx database create` and `drop` for its per-run database.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Before `cargo build`: rust-embed compiles web/dist into the release binary.
      - run: pnpm build
        working-directory: web
      - run: cargo build --release
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-spdx.sh
